name: Build Systems to Attic

on:
  push:
    branches:
      - staging
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  build-and-cache:
    runs-on: [build_server]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.RUNNER_DEPLOY_KEY }}
          ref: ${{ github.event_name == 'schedule' && 'master' || '' }}
          fetch-depth: 0

      - name: Update flake.lock and advance staging (scheduled runs only)
        if: github.event_name == 'schedule'
        env:
          RUNNER_DEPLOY_KEY: ${{ secrets.RUNNER_DEPLOY_KEY }}
        run: ./scripts/ci-update-flake.sh

      - name: Build all targets and push to local Attic
        env:
          RUNNER_DEPLOY_KEY: ${{ secrets.RUNNER_DEPLOY_KEY }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: ./scripts/ci-build-all.sh
