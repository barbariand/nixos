name: Flake Check

on:
  push:
    branches-ignore:
      - staging

jobs:
  check:
    runs-on: [build_server]
    defaults:
      run:
        shell: nix develop --command bash -eo pipefail {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.RUNNER_DEPLOY_KEY }}
          fetch-depth: 0

      - name: Run Flake Check
        env:
          RUNNER_DEPLOY_KEY: ${{ secrets.RUNNER_DEPLOY_KEY }}
        run: python3 -m scripts.ci.ci_check
