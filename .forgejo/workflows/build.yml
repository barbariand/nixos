name: Build Systems to Attic

on:
  push:
    branches:
      - staging
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  build-and-cache:
    runs-on: [build_server]
    defaults:
      run:
        shell: nix develop --command bash -eo pipefail {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.RUNNER_DEPLOY_KEY }}
          ref: ${{ github.event_name == 'schedule' && 'master' || '' }}
          fetch-depth: 0

      - name: Update flake.lock and advance staging
        if: github.event_name == 'schedule'
        env:
          RUNNER_DEPLOY_KEY: ${{ secrets.RUNNER_DEPLOY_KEY }}
        run: python3 -m scripts.ci.ci_update_flake

      - name: Check, Build and Push to Attic
        if: github.event_name != 'schedule'
        env:
          RUNNER_DEPLOY_KEY: ${{ secrets.RUNNER_DEPLOY_KEY }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: python3 -m scripts.ci.ci_build_all
